<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orchard Net Profile</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="dashboard-page">
    <header class="dashboard-header">
      <div class="brand-wrap">
        <div class="brand-mark">O</div>
        <span>Orchard Net</span>
      </div>
      <div class="header-actions">
        <a href="/app" class="ghost-button">Back to chat</a>
        <button id="logoutButton" class="secondary-button">Log out</button>
      </div>
    </header>

    <main class="public-profile-container">
      <div id="publicProfile" class="profile-summary"></div>
      <p id="profileDescription" class="feature-card"></p>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
