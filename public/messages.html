<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Hub - Orchard Net</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .messages-page {
        display: flex;
        height: 100vh;
        background: #0f172a;
      }

      .sidebar-messages {
        width: 280px;
        background: #1e293b;
        border-right: 1px solid #334155;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .sidebar-header {
        padding: 16px;
        border-bottom: 1px solid #334155;
      }

      .sidebar-header h2 {
        margin: 0;
        font-size: 18px;
        color: #f1f5f9;
      }

      .sidebar-tabs {
        display: flex;
        gap: 8px;
        padding: 12px 16px 0;
        border-bottom: 1px solid #334155;
      }

      .sidebar-tabs button {
        flex: 1;
        padding: 8px 12px;
        background: transparent;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        font-size: 13px;
        border-bottom: 2px solid transparent;
        transition: all 0.2s;
      }

      .sidebar-tabs button.active {
        color: #f1f5f9;
        border-bottom-color: #3b82f6;
      }

      .sidebar-content {
        flex: 1;
        overflow-y: auto;
        padding: 12px 0;
      }

      .sidebar-content::-webkit-scrollbar {
        width: 6px;
      }

      .sidebar-content::-webkit-scrollbar-track {
        background: transparent;
      }

      .sidebar-content::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 3px;
      }

      .conversation-item {
        padding: 12px 16px;
        border-bottom: 1px solid #334155;
        cursor: pointer;
        transition: background 0.2s;
      }

      .conversation-item:hover {
        background: #293548;
      }

      .conversation-item.active {
        background: #1f2937;
        border-left: 3px solid #3b82f6;
      }

      .conversation-item strong {
        display: block;
        color: #f1f5f9;
        margin-bottom: 4px;
        font-size: 14px;
      }

      .conversation-item .meta {
        color: #94a3b8;
        font-size: 12px;
      }

      .search-friends {
        padding: 12px 16px;
      }

      .search-friends input {
        width: 100%;
        padding: 8px 12px;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 6px;
        color: #f1f5f9;
        font-size: 13px;
      }

      .search-friends input::placeholder {
        color: #64748b;
      }

      .search-results {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: #1e293b;
        border: 1px solid #334155;
        border-top: none;
        max-height: 300px;
        overflow-y: auto;
        z-index: 10;
      }

      .search-results .user-item {
        padding: 12px 16px;
        border-bottom: 1px solid #334155;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .search-results .user-item:hover {
        background: #293548;
      }

      .search-results .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #475569;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
        color: #e2e8f0;
      }

      .search-results .info {
        flex: 1;
      }

      .search-results .info strong {
        display: block;
        color: #f1f5f9;
        font-size: 13px;
      }

      .search-results .info .username {
        color: #94a3b8;
        font-size: 12px;
      }

      .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #0f172a;
      }

      .chat-header {
        padding: 16px;
        border-bottom: 1px solid #334155;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .chat-header h3 {
        margin: 0;
        font-size: 16px;
        color: #f1f5f9;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .chat-messages::-webkit-scrollbar {
        width: 8px;
      }

      .chat-messages::-webkit-scrollbar-track {
        background: transparent;
      }

      .chat-messages::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 4px;
      }

      .message-bubble {
        display: flex;
        gap: 12px;
        animation: slideIn 0.3s ease;
      }

      .message-bubble.self {
        justify-content: flex-end;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message-bubble .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #475569;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
        color: #e2e8f0;
        flex-shrink: 0;
      }

      .message-bubble.self .avatar {
        order: 2;
      }

      .message-content {
        max-width: 60%;
      }

      .message-bubble.self .message-content {
        text-align: right;
      }

      .message-bubble .sender-name {
        display: block;
        font-size: 12px;
        font-weight: bold;
        color: #94a3b8;
        margin-bottom: 4px;
      }

      .message-bubble.self .sender-name {
        text-align: right;
      }

      .message-bubble .text {
        background: #1f2937;
        color: #e2e8f0;
        padding: 10px 14px;
        border-radius: 8px;
        word-wrap: break-word;
      }

      .message-bubble.self .text {
        background: #3b82f6;
      }

      .message-bubble .image {
        max-width: 300px;
        border-radius: 8px;
        margin-top: 6px;
      }

      .no-conversation {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #64748b;
        text-align: center;
        padding: 20px;
      }

      .chat-input-area {
        padding: 16px;
        border-top: 1px solid #334155;
      }

      .chat-input-form {
        display: flex;
        gap: 12px;
        align-items: flex-end;
      }

      .chat-input-form input {
        flex: 1;
        padding: 10px 14px;
        background: #1f2937;
        border: 1px solid #334155;
        border-radius: 6px;
        color: #f1f5f9;
        font-size: 14px;
      }

      .chat-input-form input::placeholder {
        color: #64748b;
      }

      .chat-input-form button {
        padding: 10px 16px;
        background: #3b82f6;
        border: none;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.2s;
      }

      .chat-input-form button:hover {
        background: #2563eb;
      }

      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #64748b;
        gap: 16px;
      }

      .empty-state svg {
        width: 64px;
        height: 64px;
        opacity: 0.5;
      }

      @media (max-width: 768px) {
        .sidebar-messages {
          width: 100%;
          max-width: 280px;
        }

        .message-content {
          max-width: 80%;
        }
      }
    </style>
  </head>
  <body class="messages-page">
    <aside class="sidebar-messages">
      <div class="sidebar-header">
        <h2>Messages</h2>
      </div>

      <div class="sidebar-tabs">
        <button class="tab-button active" data-tab="conversations">Direct</button>
        <button class="tab-button" data-tab="friends">Friends</button>
      </div>

      <div class="search-friends" style="position: relative;">
        <input 
          id="friendSearch" 
          type="text" 
          placeholder="Search friends..." 
        />
        <div id="searchResults" class="search-results" style="display: none;"></div>
      </div>

      <div id="conversationsList" class="sidebar-content">
        <!-- Conversations will be populated here -->
      </div>
    </aside>

    <main class="chat-main">
      <div class="chat-header">
        <h3 id="chatTitle">Select a conversation</h3>
        <button id="unfriendBtn" style="display: none;" class="secondary-button" style="background: #ef4444; border: none; padding: 8px 12px; color: white; border-radius: 4px; cursor: pointer;">Remove Friend</button>
      </div>

      <div id="chatContainer" class="chat-messages">
        <div class="empty-state">
          <p>Select a conversation to start messaging</p>
        </div>
      </div>

      <div id="chatInputArea" class="chat-input-area" style="display: none;">
        <form id="messageForm" class="chat-input-form">
          <input id="messageInput" type="text" placeholder="Type a message..." />
          <button type="submit">Send</button>
        </form>
      </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/messages.js"></script>
  </body>
</html>
